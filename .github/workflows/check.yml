name: VPN Gate Node Check

on:
  workflow_dispatch:
  schedule:
    # 每 30 分钟自动更新一次节点列表 (UTC 时间的整点与 30 分)
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 若在 GitHub 仓库添加了 Variables 或 Secrets 则优先读取，否则使用公共检测 Worker
          CHECK_WORKER: ${{ vars.CHECK_WORKER || secrets.CHECK_WORKER || 'https://check.socks5.cmliussss.net/check?sstp=vpn:vpn@' }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || secrets.CLOUDFLARE_PROJECT_NAME || 'gate' }}

      # ---------------------------------------------------------
      # 1. 部署到 Cloudflare Pages (需在 GitHub Secrets 中配置 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID)
      # ---------------------------------------------------------
      - name: Deploy to Cloudflare Pages
        id: cf_pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PROJECT_NAME || secrets.CLOUDFLARE_PROJECT_NAME || 'gate' }}
          directory: public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # 2. 部署到 GitHub Pages (双重备份 / 若未配置 Cloudflare 则作为备选)
      # ---------------------------------------------------------
      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        if: ${{ secrets.DISABLE_GITHUB_PAGES != 'true' }}
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages (GitHub)
        if: ${{ secrets.DISABLE_GITHUB_PAGES != 'true' }}
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (GitHub)
        if: ${{ secrets.DISABLE_GITHUB_PAGES != 'true' }}
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        if: ${{ secrets.DISABLE_GITHUB_PAGES != 'true' }}
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4

      # ---------------------------------------------------------
      # 3. 输出访问与订阅地址
      # ---------------------------------------------------------
      - name: Show Deployment URLs
        run: |
          echo "=========================================================="
          echo "🎉 节点检测与页面构建完成！"
          PROJECT_NAME="${{ vars.CLOUDFLARE_PROJECT_NAME || secrets.CLOUDFLARE_PROJECT_NAME || 'gate' }}"
          if [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "🚀 [Cloudflare Pages 部署地址]"
            echo "   订阅地址: https://${PROJECT_NAME}.pages.dev/nodes.txt"
            echo "   网页面板: https://${PROJECT_NAME}.pages.dev/"
          else
            echo "ℹ️ [Cloudflare Pages 提示]"
            echo "   未检测到 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID Secrets。"
            echo "   若需部署到 Cloudflare Pages，请在仓库 Settings -> Secrets -> Actions 中配置相关变量。"
          fi
          echo "📦 [GitHub Pages 订阅地址 (备用)]"
          echo "   https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/nodes.txt"
          echo "=========================================================="
